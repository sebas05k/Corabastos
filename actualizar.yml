name: Actualizar precios Corabastos

on:
  schedule:
    - cron: "0 13 * * 1"      # lunes 8:00 a. m. hora de Bogotá (13:00 UTC)
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-crawler.txt

      - run: pip install -r requirements-crawler.txt

      - name: Descargar boletines nuevos e insertarlos en la BD
        run: python crawler/update_2026.py

      - name: Guardar la BD si cambió
        run: |
          if git diff --quiet -- data/corabastos.db; then
            echo "Sin boletines nuevos."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corabastos.db
          git commit -m "Datos: actualización $(date -u +%F)"
          git push
